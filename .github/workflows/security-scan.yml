# F11.7 — scheduled dependency + secret scans. Two-tier gate:
# production dependencies fail CI on HIGH or CRITICAL; the full tree
# (including devDependencies) fails on CRITICAL only. See the step
# comments below and docs/RUNBOOK.md §Dependency scanning.
name: security-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 07:00 UTC daily — ensures newly disclosed advisories in
    # pinned versions fail fast without waiting for the next PR.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deps (audit mode — ignore scripts)
        run: npm ci --ignore-scripts

      # Production dependencies ship to users — any HIGH or CRITICAL
      # advisory blocks the build. Verified clean as of 2026-07-25.
      - name: npm audit — production deps, fail on HIGH
        run: npm audit --omit=dev --audit-level=high

      # Full tree including devDependencies. Gated at CRITICAL because
      # GHSA-mh99-v99m-4gvg (brace-expansion DoS) has no fix in the 1.x
      # line, and eslint-plugin-import / -react / -jsx-a11y and
      # @eslint/eslintrc all still pin minimatch@^3.1.2 at their latest
      # published versions. Dev-only — never deployed. Findings still
      # print in the log. Re-review once that chain moves off minimatch@3.
      - name: npm audit — full tree, fail on CRITICAL
        run: npm audit --audit-level=critical
